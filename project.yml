name: LiveCue
options:
  bundleIdPrefix: com.mahmudkarim
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
packages:
  DesertAnt:
    url: https://github.com/Desert-Ant-Labs/desert-ant-core
    exactVersion: 3.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
targets:
  LiveCueCore:
    type: framework
    platform: iOS
    sources: Sources/LiveCueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.LiveCueCore
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  LiveCue:
    type: application
    platform: iOS
    sources: Sources/LiveCue
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LiveCue
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: LiveCue records audio to transcribe conversations locally on this iPhone.
        NSCameraUsageDescription: LiveCue scans the pairing QR code displayed on your Windows PC.
        NSLocalNetworkUsageDescription: LiveCue connects privately to your Windows PC over your Tailscale network.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: LiveCueCore
      - package: DesertAnt
        product: Voz
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.LiveCue
        PRODUCT_NAME: LiveCue
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: targeted
  LiveCueCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/LiveCueCoreTests
    dependencies:
      - target: LiveCueCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  LiveCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: LiveCue
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  LiveCue:
    build:
      targets:
        LiveCue: all
        LiveCueCore: all
        LiveCueCoreTests: [test]
        LiveCueUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LiveCueCoreTests
        - name: LiveCueUITests
