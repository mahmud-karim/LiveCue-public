name: Test and build LiveContainer IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  simulator-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - id: simulator
        run: |
          DEVICE_ID="$(python3 Scripts/select_simulator.py)"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Boot simulator before testing
        timeout-minutes: 5
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.device_id }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.device_id }}" -b
      - name: Run full simulator suite
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test -project LiveCue.xcodeproj -scheme LiveCue \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath artifacts/LiveCueTests.xcresult CODE_SIGNING_ALLOWED=NO \
            | tee artifacts/xcodebuild.log
      - if: always()
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.device_id }}" || true
          xcrun simctl io "${{ steps.simulator.outputs.device_id }}" screenshot artifacts/final-screen.png || true
          xcrun xcresulttool export attachments --path artifacts/LiveCueTests.xcresult --output-path artifacts/screenshots || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecue-release-test-evidence
          path: artifacts
          retention-days: 14

  build-and-release:
    needs: simulator-test
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project LiveCue.xcodeproj -scheme LiveCue -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/LiveCueDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/LiveCue-device-build.log"
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/LiveCueDerivedData/Build/Products/Release-iphoneos/LiveCue.app"
          PACKAGE_ROOT="$RUNNER_TEMP/LiveCuePackage"
          IPA_PATH="$GITHUB_WORKSPACE/LiveCue.ipa"
          test -d "$APP_PATH"
          test -f "$APP_PATH/LiveCue"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.mahmudkarim.LiveCue"
          file "$APP_PATH/LiveCue" | grep -q arm64
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/LiveCue.app"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_ROOT/Payload" "$IPA_PATH"
          unzip -t "$IPA_PATH"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 LiveCue.ipa | tee LiveCue.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: livecue-device-build
          path: |
            LiveCue.ipa
            LiveCue.ipa.sha256
            ${{ runner.temp }}/LiveCue-device-build.log
          retention-days: 14
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" LiveCue.ipa LiveCue.ipa.sha256 --clobber
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "LiveCue $RELEASE_TAG" \
              --notes "Unsigned iPhoneOS IPA for personal use through LiveContainer. Simulator tests passed before this build."
          else
            gh release create "$RELEASE_TAG" LiveCue.ipa LiveCue.ipa.sha256 \
              --target "$GITHUB_SHA" --title "LiveCue $RELEASE_TAG" \
              --notes "Unsigned iPhoneOS IPA for personal use through LiveContainer. Simulator tests passed before this build."
          fi
      - name: Re-download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir "$RUNNER_TEMP/release-check"
          cd "$RUNNER_TEMP/release-check"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'LiveCue.ipa*'
          shasum -a 256 -c LiveCue.ipa.sha256
          unzip -t LiveCue.ipa
          unzip -l LiveCue.ipa | grep -q 'Payload/LiveCue.app/LiveCue'
