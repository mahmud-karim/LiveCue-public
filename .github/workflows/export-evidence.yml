name: Export simulator screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing livecue-release-test-evidence
        required: true
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Download and export test attachments
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name livecue-release-test-evidence --dir evidence
          xcrun xcresulttool export attachments --path evidence/LiveCueTests.xcresult --output-path screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: inspected-simulator-screenshots
          path: screenshots
          retention-days: 7
